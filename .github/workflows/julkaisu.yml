# Päivittää sarjataulukon ja tilastot pirkanmaanpool.fi:stä ja julkaisee sivun GitHub Pagesiin.
# Ajetaan jokaisesta pushista oletushaaraan, ajastetusti ja käsin (Actions → Julkaisu → Run workflow).
name: Julkaisu

on:
  push:
  schedule:
    # Kolmen tunnin välein ympäri vuorokauden (vetokassan tapahtumat ehtivät talteen ennen kuin ntfy.sh unohtaa ne).
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  julkaisu:
    # Pages hyväksyy julkaisun vain oletushaarasta (oli sen nimi mikä tahansa).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae liigadata
        # Jos pirkanmaanpool.fi ei vastaa, julkaistaan silti edellisellä datalla.
        continue-on-error: true
        run: python scripts/paivita_data.py

      - name: Tallenna vetokassan tapahtumat
        # ntfy.sh säilyttää viestejä vain ~12 h, joten ne kopioidaan pysyvästi repoon.
        continue-on-error: true
        run: python scripts/tallenna_kassa.py

      - name: Tallenna muuttunut data repoon
        run: |
          # Commitoidaan vain, jos jokin muu kuin aikaleima muuttui.
          muutos=0
          # liigadata: vain jos jokin muu kuin aikaleima muuttui
          if git diff -U0 -- data/liiga.json | grep -E '^[-+][^-+]' | grep -qv '"paivitetty"'; then
            git add data/liiga.json; muutos=1
          else
            git checkout -- data/liiga.json
          fi
          if ! git diff --quiet -- data/kassa.json; then
            git add data/kassa.json; muutos=1
          fi
          if [ "$muutos" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit -m "Päivitä liigadata ja vetokassa"
            git push
          else
            echo "Ei muutoksia."
          fi

      - name: Kokoa sivusto
        run: |
          mkdir -p _site
          cp -r index.html css js data img _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

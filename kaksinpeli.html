<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>John vs Jussi · Nekapool 2</title>
  <meta name="theme-color" content="#08070a">
  <meta property="og:title" content="🎱 LIVE: John vs Jussi">
  <meta property="og:description" content="Kaksinpeli 4 voittoon. Seuraa tilannetta erä erältä.">
  <meta property="og:image" content="https://samppafin.github.io/Nekapool-2/img/nekapool2-og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Caveat:wght@500;700&family=Patrick+Hand&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="css/tyyli.css">
  <style>
    /* Väliaikainen kaksinpelin live: yksi peli, isot napit puhelimelle. */
    body { padding-bottom: 24px; }
    .duel { max-width: 560px; margin-inline: auto; padding: 22px 16px 32px; display: flex; flex-direction: column; gap: 22px; }
    .back { color: var(--muted); font-family: var(--font-cond); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
    .duel-paper { padding: 24px 16px 22px; }
    .duel-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
    .duel-name { font-family: var(--font-hand2); font-weight: 700; font-size: 36px; line-height: 1; overflow-wrap: anywhere; }
    .duel-score { font-family: var(--font-hand2); font-weight: 700; font-size: 84px; line-height: 0.9; }
    .duel-mid { font-family: var(--font-hand2); font-size: 40px; color: var(--ink-soft); }
    .duel-tally { display: flex; justify-content: center; min-height: 30px; margin-top: 6px; }
    .duel-won .duel-name { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; color: var(--pink-deep); }
    .duel-frames { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
    .duel-frames span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-body); color: #fff; }
    .duel-frames .k { background: var(--pink); }
    .duel-frames .v { background: var(--ink); }
    .duel-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .duel-ctl .btn { min-height: 76px; font-family: var(--font-poster); font-weight: 400; font-size: 26px; letter-spacing: 0.03em; }
    .duel-ctl .plus-k { background: var(--pink); color: var(--on); border-color: var(--on); }
    .duel-ctl .plus-v { background: var(--gold); color: var(--on); border-color: var(--on); }
    .duel-ctl .minus { min-height: 48px; font-size: 18px; background: transparent; box-shadow: none; border-color: var(--line); color: var(--fg); }
    .duel-ctl .wide { grid-column: 1 / -1; }
    .duel-login { display: flex; gap: 8px; }
    .duel-login .code-in { flex: 1; min-width: 0; font-size: 28px; min-height: 56px; }
    .duel-status { text-align: center; font-size: 24px; margin: 14px 0 0; min-height: 1.3em; }
  </style>
</head>
<body>
<a class="ticker" href="#">
  <span class="ticker-tag"><span class="live-dot" id="syncDot" aria-hidden="true"></span>Live</span>
  <span class="ticker-track"><span class="ticker-run" id="ticker">John vs Jussi · 4 voittoon</span></span>
</a>

<main class="duel">
  <a class="back" href="./">← Nekapool 2 -etusivulle</a>
  <header>
    <p class="sec-kick">Väliaikainen live · kaksinpeli</p>
    <h2>John vs Jussi</h2>
    <p class="sync"><span id="syncText">Yhdistetään…</span></p>
  </header>

  <div class="paper-wall">
    <div class="paper duel-paper">
      <div class="p-date"><span id="pDate">–</span> · 4 voittoon</div>
      <div class="duel-grid">
        <div id="sideK"><div class="duel-name" id="nameK">John</div><div class="duel-tally" id="tallyK"></div></div>
        <div class="duel-mid"><span class="duel-score" id="scoreK">0</span>–<span class="duel-score" id="scoreV">0</span></div>
        <div id="sideV"><div class="duel-name" id="nameV">Jussi</div><div class="duel-tally" id="tallyV"></div></div>
      </div>
      <div class="duel-frames" id="frames" aria-label="Erät järjestyksessä"></div>
      <p class="duel-status" id="status" aria-live="polite"></p>
    </div>
  </div>

  <div class="duel-ctl" id="ctl" hidden>
    <button class="btn plus-k" id="plusK" type="button">+ John</button>
    <button class="btn plus-v" id="plusV" type="button">+ Jussi</button>
    <button class="btn minus" id="minusK" type="button">− John</button>
    <button class="btn minus" id="minusV" type="button">− Jussi</button>
    <button class="btn btn-ghost wide" id="resetBtn" type="button">Uusi peli</button>
  </div>

  <form class="login-gate" id="gate" hidden>
    <p>Kirjaa tuloksia omalla koodillasi. Ilman koodia tilannetta voi seurata.</p>
    <div class="duel-login">
      <input class="code-in" id="codeIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="•••" aria-label="Koodi">
      <button class="btn" type="submit">Kirjaudu</button>
    </div>
    <p class="err" id="loginErr" aria-live="polite"></p>
  </form>
</main>

<script src="js/live.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';
  var RACE = 4, K = 'John', V = 'Jussi';
  var state = null, live = null;
  function $(id) { return document.getElementById(id); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fresh() { return { v: 2, ts: 0, id: 'kaksinpeli', vaihe: 'kaynnissa', pvm: today(), koti: K, vieras: V, race: RACE, pelit: [{ k: K, v: V, h: '', p: false }] }; }
  function clean(s) {
    if (!s || !Array.isArray(s.pelit) || !s.pelit[0]) return null;
    var h = String(s.pelit[0].h || '').replace(/[^kv]/g, ''), out = '', a = 0, b = 0;
    for (var i = 0; i < h.length && a < RACE && b < RACE; i++) { out += h[i]; if (h[i] === 'k') a++; else b++; }
    var st = fresh(); st.ts = Number(s.ts) || 0; st.pvm = /^\d{4}-\d\d-\d\d$/.test(s.pvm) ? s.pvm : today(); st.pelit[0].h = out;
    return st;
  }
  function count(h) { var a = 0, b = 0; for (var i = 0; i < h.length; i++) { if (h[i] === 'k') a++; else b++; } return [a, b]; }
  function tally(n) {
    var wrap = document.createElement('span'); wrap.className = 'tally';
    for (var g = 0; g * 5 < n; g++) {
      var grp = document.createElement('span'); grp.className = 'tg';
      var c = Math.min(5, n - g * 5);
      for (var i = 0; i < Math.min(4, c); i++) grp.appendChild(document.createElement('i'));
      if (c === 5) grp.classList.add('five');
      wrap.appendChild(grp);
    }
    return wrap;
  }
  function render() {
    var h = state.pelit[0].h, e = count(h), done = e[0] >= RACE || e[1] >= RACE;
    var d = state.pvm.split('-');
    $('pDate').textContent = (+d[2]) + '.' + (+d[1]) + '.' + d[0];
    $('scoreK').textContent = e[0]; $('scoreV').textContent = e[1];
    $('tallyK').textContent = ''; $('tallyK').appendChild(tally(e[0]));
    $('tallyV').textContent = ''; $('tallyV').appendChild(tally(e[1]));
    $('sideK').classList.toggle('duel-won', e[0] >= RACE);
    $('sideV').classList.toggle('duel-won', e[1] >= RACE);
    var fr = $('frames'); fr.textContent = '';
    h.split('').forEach(function (c, i) {
      var s = document.createElement('span'); s.className = c; s.textContent = i + 1;
      s.title = (c === 'k' ? K : V) + ' voitti erän ' + (i + 1); fr.appendChild(s);
    });
    var status = done ? (e[0] > e[1] ? K : V) + ' voitti ' + Math.max(e[0], e[1]) + '–' + Math.min(e[0], e[1]) + '! 🏆'
      : (h.length ? 'Erä ' + (h.length + 1) + ' käynnissä' : 'Peli alkaa. 4 erävoittoa voittaa.');
    $('status').textContent = status;
    $('ticker').textContent = K + ' ' + e[0] + '–' + e[1] + ' ' + V + '   ★   ' + status;
    var me = window.Auth && window.Auth.user();
    $('ctl').hidden = !me; $('gate').hidden = !!me;
    $('plusK').disabled = $('plusV').disabled = done;
    $('minusK').disabled = e[0] === 0; $('minusV').disabled = e[1] === 0;
  }
  function save() {
    state.ts = Date.now();
    render();
    if (live) live.save(JSON.parse(JSON.stringify(state))).catch(function () { setSync(false, 'Tallennus epäonnistui – tarkista verkko'); });
  }
  function add(c) { var e = count(state.pelit[0].h); if (e[0] >= RACE || e[1] >= RACE) return; state.pelit[0].h += c; try { navigator.vibrate && navigator.vibrate(30); } catch (x) {} save(); }
  function remove(c) { var h = state.pelit[0].h, i = h.lastIndexOf(c); if (i < 0) return; state.pelit[0].h = h.slice(0, i) + h.slice(i + 1); save(); }
  function setSync(ok, text) { $('syncDot').className = 'live-dot ' + (ok ? 'ok' : 'err'); $('syncText').textContent = text; }

  $('plusK').addEventListener('click', function () { add('k'); });
  $('plusV').addEventListener('click', function () { add('v'); });
  $('minusK').addEventListener('click', function () { remove('k'); });
  $('minusV').addEventListener('click', function () { remove('v'); });
  $('resetBtn').addEventListener('click', function () { if (confirm('Aloitetaanko uusi peli? Nykyiset erät nollataan.')) { state = fresh(); save(); } });
  $('gate').addEventListener('submit', function (e) {
    e.preventDefault();
    window.Auth.login($('codeIn').value).then(function (p) {
      if (!p) { $('loginErr').textContent = 'Koodi ei kelpaa.'; return; }
      $('codeIn').value = ''; $('loginErr').textContent = ''; render();
    });
  });

  state = fresh();
  render();
  window.Auth.onChange(render);
  live = window.Live.connect({
    aihe: 'nekapool2-kaksinpeli-7c1e04b95a2d',
    onState: function (s) { s = clean(s); if (s) { state = s; render(); } },
    onStatus: setSync
  });
})();
</script>
</body>
</html>
